name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Formatting
        run: npm run format:check
      - name: TypeScript
        run: npm run typecheck
      - name: Independent business and access tests
        run: npm test
      - name: Production build without deployment credentials
        run: npm run build
      - name: HTTP integration against an isolated production build
        env:
          GP_HTTP_QA_PORT: "3100"
          GP_PUBLIC_LAUNCH: "false"
        run: ./node_modules/.bin/tsx scripts/verify-local-http.ts
